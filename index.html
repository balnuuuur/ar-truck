<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Жүргізуші сізді көре ала ма? (AR)</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #ui-container {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 92%;
      max-width: 420px;
    }
    #status-box {
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    #points-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 100%;
    }
    .point-btn {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border: 1px solid #ccc;
      padding: 8px 5px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .point-btn:active {
      background: #cbd5e1;
    }
    #toggle-blindspots {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #toggle-blindspots:active {
      background: #1d4ed8;
    }
    #label-top {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(255, 255, 255, 0.85);
      color: #111;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="label-top">Жеңілдетілген оқу моделі</div>

  <div id="ui-container">
    <div id="status-box">Мүсіншені қою үшін төменнен нүктені таңдаңыз</div>
    
    <div id="points-grid">
      <button class="point-btn" data-x="0" data-z="0.45" data-visible="false" data-name="Кабина алды">1. Кабина алды</button>
      <button class="point-btn" data-x="0.28" data-z="0.15" data-visible="false" data-name="Оң жақ борт">2. Оң борт</button>
      <button class="point-btn" data-x="0" data-z="-0.55" data-visible="false" data-name="Көлік арты">3. Көлік арты</button>
      <button class="point-btn" data-x="-0.32" data-z="0.05" data-visible="true" data-name="Сол айна аймағы">4. Сол айна</button>
      <button class="point-btn" data-x="-0.15" data-z="0.65" data-visible="true" data-name="Алдыңғы алыс">5. Алыс алды</button>
      <button class="point-btn" data-x="0.45" data-z="-0.25" data-visible="true" data-name="Оң алыс бұрыш">6. Оң бұрыш</button>
    </div>

    <button id="toggle-blindspots">Соқыр аймақтарды көрсету</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-plane position="0 0 0" rotation="-90 0 0" width="1.4" height="1.4" color="#333333" opacity="0.7"></a-plane>

      <a-entity id="truck" position="0 0 0">
        <a-box position="0 0.18 -0.15" width="0.3" height="0.3" depth="0.55" color="#e5e7eb"></a-box>
        <a-box position="0 0.14 0.22" width="0.28" height="0.22" depth="0.2" color="#2563eb"></a-box>
        <a-box position="0 0.18 0.321" width="0.24" height="0.1" depth="0.01" color="#93c5fd"></a-box>
      </a-entity>

      <a-entity id="pedestrian" visible="false" position="0 0 0">
        <a-cylinder position="0 0.08 0" radius="0.025" height="0.16" color="#f59e0b"></a-cylinder>
        <a-sphere position="0 0.19 0" radius="0.025" color="#fde68a"></a-sphere>
      </a-entity>

      <a-circle class="visual-spot" data-visible="false" position="0 0.01 0.45" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="false" position="0.28 0.01 0.15" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="false" position="0 0.01 -0.55" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="true" position="-0.32 0.01 0.05" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="true" position="-0.15 0.01 0.65" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="true" position="0.45 0.01 -0.25" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>

    </a-entity>
  </a-scene>

  <script src="script.js"></script>
</body>
</html>
