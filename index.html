<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Жүргізуші сізді көре ала ма? (AR)</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #ui-container {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 92%;
      max-width: 420px;
    }
    #status-box {
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    #hint-row {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 6px;
    }
    #hint-toggle-btn {
      background: rgba(17, 24, 39, 0.92);
      color: #fde68a;
      border: 1px solid rgba(253, 230, 138, 0.45);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    #hint-toggle-btn:active {
      background: rgba(31, 41, 55, 0.95);
    }
    #hint-box {
      display: none;
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      border-left: 4px solid #38bdf8;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }
    #points-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 100%;
    }
    .point-btn {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border: 1px solid #ccc;
      padding: 8px 5px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .point-btn:active {
      background: #cbd5e1;
    }
    #toggle-blindspots {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #toggle-blindspots:active {
      background: #1d4ed8;
    }
    #label-top {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(255, 255, 255, 0.85);
      color: #111;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="label-top">AR оқу моделі - Соқыр аймақтар</div>

  <div id="ui-container">
    <div id="status-box">Мүсіншені қою үшін төменнен нүктені таңдаңыз</div>

    <div id="hint-row">
      <button id="hint-toggle-btn" type="button">💡 Түсіндірмені ашу</button>
      <div id="hint-box"></div>
    </div>
    
    <div id="points-grid">
      <button class="point-btn" data-index="0">1. Кабина алды</button>
      <button class="point-btn" data-index="1">2. Оң борт</button>
      <button class="point-btn" data-index="2">3. Көлік арты</button>
      <button class="point-btn" data-index="3">4. Сол айна</button>
      <button class="point-btn" data-index="4">5. Алыс алды</button>
      <button class="point-btn" data-index="5">6. Оң бұрыш</button>
    </div>

    <button id="toggle-blindspots">Соқыр аймақтарды көрсету</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="truck-model" src="./truck.glb"></a-asset-item>
      <a-asset-item id="pedestrian-model" src="./pedestrian.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-plane position="0 0 0" rotation="-90 0 0" width="1.4" height="1.4" color="#333333" opacity="0.7"></a-plane>

      <a-entity id="blindspot-zones" visible="false">
        <a-plane position="0 0.005 0.44" rotation="-90 0 0" width="0.34" height="0.24" color="#ef4444" opacity="0.35"></a-plane>
        <a-plane position="0.21 0.005 0.08" rotation="-90 0 0" width="0.26" height="0.45" color="#ef4444" opacity="0.35"></a-plane>
        <a-plane position="0 0.005 -0.52" rotation="-90 0 0" width="0.36" height="0.28" color="#ef4444" opacity="0.35"></a-plane>
      </a-entity>

      <a-entity 
        id="truck" 
        gltf-model="#truck-model" 
        position="0 0 0" 
        scale="0.11 0.11 0.11" 
        rotation="0 0 0">
      </a-entity>

      <a-entity 
        id="pedestrian" 
        visible="false" 
        position="0 0 0"
        gltf-model="#pedestrian-model"
        scale="0.02 0.02 0.02"
        rotation="0 0 0">
      </a-entity>

      <a-circle class="visual-spot" data-visible="false" data-name="Кабинаның дәл алды" position="0 0.01 0.55" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="false" data-name="Оң жақ борт" position="0.22 0.01 0.15" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="false" data-name="Көліктің арты" position="0 0.01 -0.55" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="true" data-name="Сол жақ айна аймағы" position="-0.32 0.01 0.05" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="true" data-name="Алдыңғы алыс қашықтық" position="-0.15 0.01 0.65" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>
      <a-circle class="visual-spot" data-visible="true" data-name="Оң жақ алыс бұрыш" position="0.45 0.01 -0.25" rotation="-90 0 0" radius="0.07" color="#9ca3af"></a-circle>

    </a-entity>
  </a-scene>

  <script src="script.js"></script>
</body>
</html>
